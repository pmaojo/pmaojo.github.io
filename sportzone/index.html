<!doctype html>
<html class="no-js" lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Sport Zone | Juego de Navidad</title>
    <meta name="description" content="Ayuda al protagonista de Sport Zone a superar el reto navideño y consigue la máxima puntuación.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="js/phaser.min.js"></script>
    <script defer src="js/touch-control-plugin.js"></script>
    <script defer src="js/game-assets.js"></script>
    <script defer src="src/init.js"></script>
    <script defer src="src/preload.js"></script>
    <script defer src="src/gametitle.js"></script>
    <script defer src="src/thegame.js"></script>
    <script defer src="src/gameover.js"></script>
    <script defer src="js/game-bootstrap.js"></script>
    <script defer src="js/game-modal.js"></script>
</head>
<body>
<div class="container" role="document">
    <div id="juegonavidad">
        <main class="wrapper" role="main">
            <div class="row fonder">
                <div class="col-3 fondo hero-panel">
                    <img src="img/slogan.png" alt="Lema promocional de Sport Zone" class="hero-panel__logo">
                </div>
                <div class="col-6 central-panel" aria-labelledby="game-modal-title">
                    <img src="img/portada_043.png" alt="Ilustración promocional del juego navideño" class="central-panel__hero">
                    <div class="game-launcher" id="game-launcher">
                        <p class="notwide orientation-message" aria-live="polite">Gira tu móvil para poder ver el juego</p>
                        <p class="wide">
                            <button id="openGameButton" class="btn-game" type="button" aria-haspopup="dialog" aria-controls="game-modal">Jugar</button>
                        </p>
                    </div>
                </div>
                <div class="col-3 companion-panel">
                    <img src="assets/bichoanima.gif" alt="Animación del protagonista del juego" class="companion-panel__mascot">
                </div>
            </div>
        </main>
    </div>
</div>

<noscript>
    <p class="noscript-message">Activa JavaScript para poder jugar.</p>
</noscript>

<div id="game-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="game-modal-title" hidden>
    <div class="modal-content" role="document">
        <header class="modal-header">
            <h2 id="game-modal-title" class="modal-title">Sport Zone: Juego navideño</h2>
            <div class="modal-actions">
                <button type="button" class="modal-button" data-action="toggle-instructions" aria-expanded="false" aria-controls="game-instructions">Cómo jugar</button>
                <button type="button" class="modal-button close" data-action="close-modal" aria-label="Cerrar">×</button>
            </div>
        </header>
        <div class="modal-body">
            <div id="game-instructions" class="instructions" hidden>
                <img src="img/instrucciones.gif" alt="Animación con las instrucciones del juego" class="instructions__image">
            </div>
            <div class="embed-container">
                <p class="notwide orientation-message" aria-live="polite">Gira tu móvil para poder ver el juego</p>
                <div class="wide">
                    <div id="game" tabindex="0" role="application" aria-label="Zona de juego de Sport Zone">
                        <div class="game-loading" aria-hidden="true">
                            <img src="assets/loading.png" alt="Cargando el juego" class="game-loading__image">
                        </div>
                    </div>
                    <div id="snow" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
